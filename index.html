<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>나만의 단어장</title>
<style>
:root{--bg:#f7f8fc;--card:#fff;--text:#172033;--muted:#7d8799;--primary:#6677e8;--primary2:#8b79e9;--line:#e8ebf2;--soft:#eef0ff;--danger:#e85c68;--shadow:0 10px 30px rgba(38,45,75,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}button,input,textarea,select{font:inherit}button{border:0;cursor:pointer}.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:88px}.top{padding:22px 20px 10px}.brand{font-weight:800;font-size:25px}.sub{color:var(--muted);font-size:13px;margin-top:5px}.view{padding:10px 16px}.hero{background:linear-gradient(135deg,#6677e8,#8b79e9);color:#fff;border-radius:24px;padding:23px;box-shadow:var(--shadow);margin:4px 0 18px}.hero h1{margin:0 0 7px;font-size:24px}.hero p{margin:0 0 18px;opacity:.88;font-size:13px}.btn{border-radius:14px;padding:12px 16px;font-weight:700}.hero .btn{background:#fff;color:#5969d9}.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 3px 10px;font-weight:800}.link{color:var(--primary);font-size:13px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat,.box,.word-row,.card-wrap{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px}.stat{padding:16px}.stat b{font-size:24px;display:block}.stat span{color:var(--muted);font-size:12px}.chips{display:flex;gap:8px;overflow:auto;padding:3px 2px 7px}.chip{white-space:nowrap;background:#fff;border:1px solid var(--line);padding:9px 13px;border-radius:999px;font-size:12px}.chip.active{background:var(--soft);color:#5364dc;border-color:#cfd4ff;font-weight:700}.recent{display:grid;gap:9px}.word-row{padding:14px 15px;display:flex;justify-content:space-between;align-items:center}.word-row .en{font-weight:800}.word-row .desc{font-size:12px;color:var(--muted);margin-top:4px}.star{background:none;font-size:22px}.fab{width:52px;height:52px;border-radius:17px;background:var(--primary);color:#fff;font-size:26px;box-shadow:0 10px 22px #6677e855}.form{display:grid;gap:12px}.field label{display:block;font-size:12px;font-weight:800;margin:0 0 6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px;outline:none}.field textarea{min-height:110px;resize:vertical}.primary{background:var(--primary);color:#fff;width:100%;padding:14px;border-radius:15px;font-weight:800}.secondary{background:#fff;border:1px solid var(--line);padding:12px 14px;border-radius:13px}.bookmarks{display:grid;gap:9px}.bm{display:flex;align-items:center;justify-content:space-between;padding:14px 15px;background:#fff;border:1px solid var(--line);border-radius:16px}.bm small{color:var(--muted)}.reader-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.reader-actions{display:flex;gap:8px}.reader-actions button{background:#fff;border:1px solid var(--line);width:42px;height:42px;border-radius:13px}.flip{perspective:1200px;min-height:430px}.card-wrap{height:430px;position:relative;transform-style:preserve-3d;transition:transform .55s;cursor:pointer}.card-wrap.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.back{transform:rotateY(180deg)}.category{color:var(--primary);font-size:12px;font-weight:800;margin-bottom:20px}.bigword{font-size:36px;font-weight:900;letter-spacing:-1px}.illustration{font-size:92px;margin:22px 0}.meaning{font-size:25px;font-weight:900}.description{font-size:14px;line-height:1.7;color:#596273;margin-top:12px}.hint{font-size:12px;color:var(--muted);margin-top:24px}.reader-nav{display:flex;gap:10px;margin-top:14px}.reader-nav button{flex:1;background:#fff;border:1px solid var(--line);padding:14px;border-radius:14px;font-weight:800}.bottom{position:fixed;bottom:0;left:0;right:0;height:72px;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20}.bottom-inner{width:min(720px,100%);display:grid;grid-template-columns:repeat(4,1fr)}.tab{background:none;color:#929bad;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.tab .ico{font-size:21px}.tab.active{color:var(--primary);font-weight:800}.empty{padding:30px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:30}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:720px;margin:auto;border-radius:24px 24px 0 0;padding:20px}.sheet h3{margin-top:0}.sheet-actions{display:flex;gap:8px}.sheet-actions button{flex:1}.file-note{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5}@media(min-width:721px){.bottom{left:50%;right:auto;width:720px;transform:translateX(-50%);border-left:1px solid var(--line);border-right:1px solid var(--line)}.modal{align-items:center}.sheet{border-radius:24px;max-width:500px}}
.link-btn{background:none;color:var(--primary);padding:0;text-decoration:underline;font-size:12px}.csv-preview{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fafbff;display:flex;flex-direction:column;gap:7px}.csv-preview small{color:var(--muted)}.csv-preview .secondary{align-self:flex-start;padding:9px 12px}</style></head>
<body><div class="app"><header class="top"><div class="brand">나만의 단어장</div><div class="sub">헷갈리는 의학용어를 기록하고, 틈날 때마다 복습해요.</div></header><main id="app"></main></div>
<nav class="bottom"><div class="bottom-inner"><button class="tab" data-page="home"><span class="ico">⌂</span>홈</button><button class="tab" data-page="words"><span class="ico">📚</span>단어장</button><button class="tab" data-page="add"><span class="ico">＋</span>단어등록</button><button class="tab" data-page="bookmarks"><span class="ico">★</span>책갈피</button></div></nav>
<div class="modal" id="bmModal"><div class="sheet"><h3>새 책갈피</h3><div class="field"><label>책갈피 이름</label><input id="bmInput" placeholder="예: 호흡기"></div><div class="sheet-actions" style="margin-top:12px"><button class="secondary" onclick="closeModal()">취소</button><button class="primary" onclick="addBookmark()">추가</button></div></div></div>
<script>
const seed=[
{id:1,cat:'순환기',en:'tachycardia',ko:'빈맥',desc:'심장박동수가 정상보다 빠른 상태',date:'2026-10-06',emoji:'🫀',star:true},
{id:2,cat:'호흡기',en:'pneumonia',ko:'폐렴',desc:'폐에 염증이 생긴 상태',date:'2026-10-05',emoji:'🫁',star:false},
{id:3,cat:'신경계',en:'seizure',ko:'발작',desc:'뇌의 비정상적인 전기적 활동으로 나타나는 일시적인 증상',date:'2026-10-04',emoji:'🧠',star:true},
{id:4,cat:'감염',en:'edema',ko:'부종',desc:'조직에 체액이 비정상적으로 축적된 상태',date:'2026-10-03',emoji:'🦶',star:false}
];
let words=JSON.parse(localStorage.getItem('myWords')||'null')||seed;
let cats=JSON.parse(localStorage.getItem('myCats')||'null')||['순환기','호흡기','신경계','감염'];
let page='home', filter='전체', sort='date', idx=0;
const app=document.getElementById('app');
function save(){localStorage.setItem('myWords',JSON.stringify(words));localStorage.setItem('myCats',JSON.stringify(cats))}
function today(){return new Date().toISOString().slice(0,10)}
function nav(p){page=p; if(p==='words') idx=0; render();scrollTo(0,0)}
function render(){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.page===page));app.innerHTML=page==='home'?home():page==='words'?reader():page==='add'?add():bookmarks()}
function home(){let td=today();let todayCount=words.filter(w=>w.date===td).length;return `<section class="view"><div class="hero"><h1>오늘도 한 단어씩 📚</h1><p>간호학 공부 중 헷갈렸던 의학용어를 모아두고, 이동 시간에 가볍게 복습해보세요.</p><button class="btn" onclick="nav('words')">단어장 바로가기 →</button></div><div class="stats"><div class="stat"><b>${words.length}</b><span>전체 단어</span></div><div class="stat"><b>${words.filter(w=>w.star).length}</b><span>책갈피</span></div><div class="stat"><b>${todayCount}</b><span>오늘 등록</span></div></div><div class="section-title"><span>책갈피</span><span class="link" onclick="nav('bookmarks')">관리 →</span></div><div class="chips">${cats.map(c=>`<button class="chip" onclick="filter='${c}';nav('words')">★ ${c}</button>`).join('')}</div><div class="section-title"><span>최근 등록 단어</span><span class="link" onclick="nav('add')">+ 등록</span></div><div class="recent">${[...words].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4).map(row).join('')||'<div class="empty">아직 등록된 단어가 없어요.</div>'}</div></section>`}
function row(w){return `<div class="word-row"><div onclick="openWord(${w.id})" style="flex:1;cursor:pointer"><div class="en">${esc(w.en)}</div><div class="desc">${esc(w.ko)} · ${esc(w.cat)}</div></div><button class="star" onclick="toggleStar(${w.id})">${w.star?'★':'☆'}</button></div>`}
function add(){return `<section class="view"><div class="section-title"><span>단어 등록</span></div><form class="form" onsubmit="event.preventDefault();addWord()"><div class="field"><label>책갈피(분류)</label><select id="cat">${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>단어 (영어)</label><input id="en" required placeholder="예: dyspnea"></div><div class="field"><label>설명</label><textarea id="desc" required placeholder="한글 뜻이나 간단한 설명을 입력하세요."></textarea></div><div class="field"><label>등록일</label><input id="date" type="date" value="${today()}"></div><div class="field"><label>CSV로 여러 단어 한꺼번에 등록</label><input id="csv" type="file" accept=".csv,text/csv" onchange="previewCSV(event)"><div class="file-note">권장 열: 책갈피, 단어(영어), 설명, 등록일. 첫 줄은 제목(헤더)으로 인식합니다. <button type="button" class="link-btn" onclick="downloadCSVTemplate()">CSV 예시 파일 받기</button></div><div id="csvPreview"></div></div><button class="primary">+ 단어 저장</button></form></section>`}
function addWord(){let en=v('en').trim(),desc=v('desc').trim();if(!en||!desc)return;words.unshift({id:Date.now(),cat:v('cat'),en,ko:desc.split(/[.。]/)[0]||desc,desc,date:v('date')||today(),emoji:'🩺',star:false});save();alert('단어가 등록되었습니다.');nav('words')}
function previewCSV(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const rows=parseCSV(r.result);window.pendingCSV=rows;const data=rows.slice(0,4);document.getElementById('csvPreview').innerHTML=data.length?`<div class="csv-preview"><b>${rows.length}개 단어를 읽었습니다.</b><small>예시 ${data.map(x=>esc(x.en)).join(', ')}${rows.length>4?' …':''}</small><button type="button" class="secondary" onclick="importCSV()">CSV ${rows.length}개 등록</button></div>`:''};r.readAsText(f,'UTF-8')}
function parseCSV(text){text=text.replace(/^\uFEFF/,'');const lines=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(q&&text[i+1]==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell.trim());cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell.trim());cell='';if(row.some(x=>x!==''))lines.push(row);row=[]}else cell+=c}if(cell!==''||row.length){row.push(cell.trim());if(row.some(x=>x!==''))lines.push(row)}if(!lines.length)return[];const h=lines[0].map(x=>x.toLowerCase().replace(/\s/g,''));const find=(names)=>{const i=h.findIndex(x=>names.some(n=>x===n||x.includes(n)));return i<0?0:i};const ci=find(['책갈피','분류','category']);const ei=find(['단어(영어)','단어','영어','english','word']);const di=find(['설명','뜻','한글','description']);const ti=find(['등록일','date']);return lines.slice(1).map(a=>({cat:(a[ci]||'기타').trim(),en:(a[ei]||'').trim(),desc:(a[di]||'').trim(),date:(a[ti]||today()).trim()})).filter(x=>x.en)}
function importCSV(){const rows=window.pendingCSV||[];if(!rows.length)return;const start=Date.now();rows.forEach((x,i)=>words.unshift({id:start+i,cat:x.cat||'기타',en:x.en,ko:x.desc.split(/[.。]/)[0]||x.desc,desc:x.desc,date:x.date||today(),emoji:'🩺',star:false}));const newCats=[...new Set(rows.map(x=>x.cat).filter(Boolean))];newCats.forEach(c=>{if(!cats.includes(c))cats.push(c)});save();localStorage.setItem('myCats',JSON.stringify(cats));window.pendingCSV=[];alert(`${rows.length}개 단어가 등록되었습니다.`);nav('words')}
function downloadCSVTemplate(){const csv='책갈피,단어(영어),설명,등록일\r\n순환기,tachycardia,빈맥 - 심장박동수가 정상보다 빠른 상태,2026-10-06\r\n호흡기,pneumonia,폐렴 - 폐에 염증이 생긴 상태,2026-10-10\r\n신경계,neuropathy,신경병증 - 신경이 손상되거나 기능이상으로 나타나는 상태,2026-10-11';const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='나만의_단어장_CSV_예시.csv';a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url)},1000)}
function bookmarks(){return `<section class="view"><div class="section-title"><span>책갈피 관리</span><button class="secondary" onclick="openModal()">+ 새 책갈피</button></div><div class="bookmarks">${cats.map(c=>`<div class="bm"><div><b>★ ${esc(c)}</b><br><small>${words.filter(w=>w.cat===c).length}개 단어</small></div><button class="secondary" onclick="filter='${c}';nav('words')">보기</button></div>`).join('')}</div></section>`}
function reader(){let list=words.filter(w=>filter==='전체'||w.cat===filter).sort((a,b)=>sort==='date'?b.date.localeCompare(a.date):(a.cat.localeCompare(b.cat)||a.en.localeCompare(b.en)));if(!list.length)return `<section class="view"><div class="empty">이 분류에는 단어가 없어요.<br><button class="btn" style="margin-top:15px;background:var(--primary);color:#fff" onclick="nav('add')">단어 등록하기</button></div></section>`;if(idx>=list.length)idx=0;let w=list[idx];return `<section class="view"><div class="reader-head"><div><b>단어장</b><div style="font-size:12px;color:var(--muted);margin-top:4px">${idx+1} / ${list.length}</div></div><div class="reader-actions"><button onclick="speak('${escAttr(w.en)}')">🔊</button><button onclick="toggleStar(${w.id});render()">${w.star?'★':'☆'}</button></div></div><div class="chips"><button class="chip ${filter==='전체'?'active':''}" onclick="filter='전체';idx=0;render()">전체</button>${cats.map(c=>`<button class="chip ${filter===c?'active':''}" onclick="filter='${c}';idx=0;render()">${c}</button>`).join('')}</div><div style="display:flex;gap:8px;margin:8px 0 12px"><button class="chip ${sort==='date'?'active':''}" onclick="sort='date';idx=0;render()">등록일순</button><button class="chip ${sort==='cat'?'active':''}" onclick="sort='cat';idx=0;render()">책갈피순</button></div><div class="flip"><div class="card-wrap" id="card" onclick="this.classList.toggle('flipped')"><div class="face front"><div class="category">★ ${esc(w.cat)}</div><div class="bigword">${esc(w.en)}</div><div class="illustration">${w.emoji||'🩺'}</div><div class="hint">카드를 눌러 뜻 보기</div></div><div class="face back"><div class="category">${esc(w.en)}</div><div class="meaning">${esc(w.ko)}</div><div class="description">${esc(w.desc)}</div><div class="hint">카드를 눌러 영어로 돌아가기</div></div></div></div><div class="reader-nav"><button onclick="prevWord()">‹ 이전</button><button onclick="nextWord()">다음 ›</button></div></section>`}
function prevWord(){idx--;let n=words.filter(w=>filter==='전체'||w.cat===filter).length;if(idx<0)idx=n-1;render()}function nextWord(){let n=words.filter(w=>filter==='전체'||w.cat===filter).length;idx=(idx+1)%n;render()}
function toggleStar(id){let w=words.find(x=>x.id===id);if(w){w.star=!w.star;save();if(page!=='home')render()}}
function openWord(id){let list=[...words];idx=Math.max(0,list.findIndex(w=>w.id===id));filter='전체';nav('words')}
function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}else alert('이 브라우저에서는 음성 기능을 지원하지 않습니다.')}
function openModal(){document.getElementById('bmModal').classList.add('show');document.getElementById('bmInput').focus()}function closeModal(){document.getElementById('bmModal').classList.remove('show')}
function addBookmark(){let x=document.getElementById('bmInput').value.trim();if(x&&!cats.includes(x)){cats.push(x);save();closeModal();render()}}
function v(id){return document.getElementById(id).value}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escAttr(s){return esc(s).replace(/`/g,'')}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>nav(b.dataset.page));render();
</script></body></html>
